<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TaskWave: gestor de tareas personales con calendario, kanban y registro de horas."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TaskWave</title>
    <!-- Aplica el modo guardado antes de pintar, para evitar el destello (igual que el DS Personal). -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.classList.add(t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
